services:
  db:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${MY_DB_NAME}
      POSTGRES_USER: ${MY_DB_USERNAME}
      POSTGRES_PASSWORD: ${MY_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: shortlink-app-be
    restart: on-failure
    depends_on:
      - db
    ports:
      - 8080:8080

volumes:
  db_data:

