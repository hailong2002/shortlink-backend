spring:
  application:
    name: shortlink
  profiles:
    include:
      - secret

  datasource:
    url: ${mydb.url}
    username: ${mydb.username}
    password: ${mydb.password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true

  jwt:
    secret: ${shortlink.jwt.secret:KhoangBiMatDefaultChoMayCuaBanDeRunDuocTest123456789}
    expiration: 259200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${shortlink.google.client-id}
            client-secret: ${shortlink.google.client-secret}


app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://shortlink.io.vn"

server:
  port: 10082
  forward-headers-strategy: native
#  servlet:
#    session:
#      cookie:
#        same-site: lax
#        secure: false
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        domain: shortlink.io.vn

logging:
  level:
    liquibase: DEBUG

