spring:
  application:
    name: shortlink


  datasource:
    url: jdbc:postgresql://103.56.163.31:5432/postgres
    username: postgres
    password: 123456
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# application.yml
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://shortlink.io.vn"

server:
  port: 10082
