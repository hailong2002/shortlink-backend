spring:
  application:
    name: shortlink
  profiles:
    include:
      - secret

  datasource:
    url: ${mydb.url}
    username: ${mydb.username}
    password: ${mydb.password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true



  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${shortlink.google.client-id}
            client-secret: ${shortlink.google.client-secret}
#            redirect-uri: "https://shortlink.io.vn/login/oauth2/code/google"


app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://shortlink.io.vn"
      - "https://shortlink-frontend-eight.vercel.app"

server:
  port: ${PORT:10082}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: ".*"
  servlet:
    session:
      cookie:
        same-site: lax
        secure: true
  max-http-request-header-size: 40KB


jwt:
    secret: ${shortlink.jwt.secret}
    expiration: 259200000