spring:
  application:
    name: shortlink
  profiles:
    include:
      - secret

  datasource:
    url: jdbc:postgresql://103.56.163.31:5432/postgres
    username: postgres
    password: 123@qwe
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true

  jwt:
    secret: ${shortlink.jwt.secret}
    expiration: 259200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${shortlink.google.client-id}
            client-secret: ${shortlink.google.client-secret}


# application.yml
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://shortlink.io.vn"

server:
  port: 10082

logging:
  level:
    liquibase: DEBUG

