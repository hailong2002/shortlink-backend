databaseChangeLog:
  - changeSet:
      id: 1774107120
      author: longnh
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: avatar_url
                  type: text
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createTable:
            tableName: user_auth_providers
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(50)
              - column:
                  name: provider_user_id
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - addUniqueConstraint:
            tableName: user_auth_providers
            columnNames: provider, provider_user_id
            constraintName: uq_provider_name

        - addForeignKeyConstraint:
            baseTableName: user_auth_providers
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_auth_user





